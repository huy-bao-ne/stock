<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Agent</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
        
        body { background-color: #f8fafc; font-family: 'Inter', sans-serif; color: #1e293b; overflow: hidden;}
        
        @keyframes slideUpFade {
            0% { opacity: 0; transform: translateY(20px); }
            100% { opacity: 1; transform: translateY(0); }
        }
        .animate-slide-up { animation: slideUpFade 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards; }

        @keyframes pulse-ring {
            0% { transform: scale(0.8); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 6px rgba(16, 185, 129, 0); }
            100% { transform: scale(0.8); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
        }
        .avatar-pulse { animation: pulse-ring 2s infinite; }

        /* 📝 Markdown Styling */
        .markdown-content h3 { font-weight: 800; margin-top: 1.5rem; margin-bottom: 0.75rem; font-size: 1.15rem; color: #0f172a; }
        .markdown-content p { margin-bottom: 1rem; color: #334155; line-height: 1.75; font-size: 0.95rem; }
        .markdown-content strong { color: #1e40af; font-weight: 700; background: rgba(37, 99, 235, 0.08); padding: 0.1rem 0.3rem; border-radius: 4px;}
        .markdown-content ul { list-style-type: none; padding-left: 0; margin-bottom: 1.25rem; }
        .markdown-content li { margin-bottom: 0.75rem; color: #334155; line-height: 1.6; position: relative; padding-left: 1.5rem; font-size: 0.95rem;}
        .markdown-content li::before { content: '✨'; position: absolute; left: 0; font-size: 0.85rem; top: 0.1rem; }
        
        /* 📊 Tối ưu hóa Bảng (Chống bóp chữ, thêm scroll ngang) */
        .markdown-content { overflow-x: auto; width: 100%; }
        .markdown-content table { 
            width: 100%; min-width: 750px; /* Ép bảng luôn đủ rộng để không bóp chữ */
            border-collapse: separate; border-spacing: 0; 
            margin-top: 1.5rem; margin-bottom: 1.5rem; font-size: 0.9rem; 
            border-radius: 12px; overflow: hidden; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); 
            border: 1px solid #e2e8f0; 
        }
        .markdown-content th { 
            background-color: #f1f5f9; color: #0f172a; text-align: left; 
            padding: 1rem; font-weight: 700; border-bottom: 2px solid #cbd5e1;
            white-space: nowrap;
        }
        .markdown-content td { 
            padding: 1rem; border-bottom: 1px solid #e2e8f0; color: #475569; background-color: #ffffff;
            transition: background-color 0.2s;
        }
        .markdown-content tr:hover td { background-color: #f8fafc; }
        .markdown-content tr:last-child td { border-bottom: none; }
        
        /* Typing Indicator */
        .typing-dot { width: 6px; height: 6px; background-color: #3b82f6; border-radius: 50%; display: inline-block; animation: typing 1.4s infinite ease-in-out both; margin: 0 2px;}
        .typing-dot:nth-child(1) { animation-delay: -0.32s; }
        .typing-dot:nth-child(2) { animation-delay: -0.16s; }
        @keyframes typing { 0%, 80%, 100% { transform: scale(0); opacity: 0.5;} 40% { transform: scale(1); opacity: 1;} }

        .glass-header { background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border-bottom: 1px solid rgba(226, 232, 240, 0.8); }
        .glass-footer { background: linear-gradient(to top, rgba(248,250,252,1) 40%, rgba(248,250,252,0.8) 80%, rgba(248,250,252,0) 100%); padding-top: 2rem;}
        
        ::-webkit-scrollbar { width: 6px; height: 8px; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        ::-webkit-scrollbar-track { background: transparent; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        function StockAgent() {
            const [prompt, setPrompt] = useState('');
            const [chatHistory, setChatHistory] = useState([]);
            const [loading, setLoading] = useState(false);
            const messagesEndRef = useRef(null);
            const textareaRef = useRef(null);

            const scrollToBottom = () => {
                messagesEndRef.current?.scrollIntoView({ behavior: "smooth" });
            };
            useEffect(() => { scrollToBottom(); }, [chatHistory, loading]);

            const applySuggestion = (text) => {
                handleSend(text);
            };

            const clearChat = () => {
                if(confirm("Bạn có chắc muốn làm mới phiên hội thoại?")) setChatHistory([]);
            };

            const handleInputResize = (e) => {
                setPrompt(e.target.value);
                if(textareaRef.current) {
                    textareaRef.current.style.height = '52px'; 
                    const scrollHeight = textareaRef.current.scrollHeight;
                    textareaRef.current.style.height = Math.min(scrollHeight, 150) + 'px'; 
                }
            };

            const handleSend = async (overridePrompt = null, e = null) => {
                if (e?.preventDefault) e.preventDefault();
                const textToSend = overridePrompt || prompt;
                if (!textToSend.trim() || loading) return;
                
                setPrompt(''); 
                if(textareaRef.current) textareaRef.current.style.height = '52px'; 
                
                const newHistory = [...chatHistory, { role: 'user', content: textToSend }];
                setChatHistory(newHistory);
                setLoading(true);

                try {
                    const response = await fetch(`http://localhost:8000/api/ask_agent`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ prompt: textToSend, history: chatHistory })
                    });
                    const data = await response.json();
                    
                    if(data.status === 'success') {
                        setChatHistory([...newHistory, { role: 'assistant', content: data.ai_analysis }]);
                    } else {
                        setChatHistory([...newHistory, { role: 'assistant', content: `❌ **Lỗi hệ thống:** ${data.message}` }]);
                    }
                } catch (error) {
                    setChatHistory([...newHistory, { role: 'assistant', content: '❌ **Lỗi kết nối:** Không thể liên lạc với máy chủ.' }]);
                } finally {
                    setLoading(false);
                }
            };

            const handleKeyDown = (e) => {
                if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault();
                    if(!loading) handleSend();
                }
            };

            return (
                <div className="flex flex-col h-screen bg-slate-50 selection:bg-blue-200">
                    <div className="flex items-center justify-between px-6 py-3.5 glass-header sticky top-0 z-20">
                        <div className="flex items-center gap-4">
                            <div className="relative">
                                <div className="w-11 h-11 bg-gradient-to-tr from-blue-600 to-indigo-500 rounded-2xl flex items-center justify-center text-white shadow-lg shadow-blue-500/30">
                                    <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="M12 8V4H8"/><rect width="16" height="12" x="4" y="8" rx="2"/><path d="M2 14h2"/><path d="M20 14h2"/><path d="M15 13v2"/><path d="M9 13v2"/></svg>
                                </div>
                                <span className="absolute -top-1 -right-1 w-3.5 h-3.5 rounded-full bg-emerald-400 border-2 border-white avatar-pulse"></span>
                            </div>
                            <div>
                                <h1 className="font-extrabold text-slate-800 text-[17px] tracking-tight">Agent Assistant</h1>
                                <p className="text-[12px] font-medium text-emerald-600 flex items-center gap-1.5 mt-0.5">AGENT IS ONLINE</p>
                            </div>
                        </div>
                        {chatHistory.length > 0 && (
                            <button type="button" onClick={clearChat} className="text-slate-400 hover:text-rose-500 hover:bg-rose-50 p-2.5 rounded-full transition-colors tooltip" title="Làm mới">
                                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
                            </button>
                        )}
                    </div>

                    <div className="flex-1 overflow-y-auto px-4 py-8 relative scroll-smooth">
                        {/* 🚨 TĂNG ĐỘ RỘNG KHUNG CHAT TỪ max-w-4xl LÊN max-w-[1100px] 🚨 */}
                        <div className="max-w-[1100px] mx-auto space-y-8">
                            
                            {chatHistory.length === 0 && (
                                <div className="text-center mt-12 animate-slide-up">
                                    <div className="w-24 h-24 bg-white rounded-3xl flex items-center justify-center mx-auto mb-6 shadow-[0_8px_30px_rgb(0,0,0,0.04)] border border-slate-100">
                                        <div className="w-16 h-16 bg-blue-50/50 rounded-2xl flex items-center justify-center text-blue-500">
                                            <svg xmlns="http://www.w3.org/2000/svg" width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/></svg>
                                        </div>
                                    </div>
                                    <h2 className="text-3xl font-extrabold text-slate-800 mb-3 tracking-tight">Chào buổi sáng!</h2>
                                    <p className="text-slate-500 mb-10 text-[15px] max-w-lg mx-auto leading-relaxed">Tôi là chuyên gia AI tài chính của bạn.</p>
                                    
                                    <div className="grid grid-cols-1 md:grid-cols-2 gap-4 text-left max-w-2xl mx-auto">
                                        <button type="button" onClick={() => applySuggestion('Phân tích kết quả kinh doanh quý mới nhất của cổ phiếu FPT')} className="p-5 rounded-2xl bg-white border border-slate-200 hover:-translate-y-1 hover:shadow-lg hover:border-blue-200 transition-all duration-300 group">
                                            <div className="w-10 h-10 rounded-full bg-blue-50 flex items-center justify-center mb-3 group-hover:scale-110 transition-transform">
                                                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#3b82f6" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"></polyline></svg>
                                            </div>
                                            <span className="block font-bold text-slate-700 mb-1">Phân tích Doanh nghiệp</span>
                                            <span className="text-slate-500 text-[13px]">Báo cáo tài chính FPT</span>
                                        </button>
                                        <button type="button" onClick={() => applySuggestion('Chiến tranh Trung Đông ảnh hưởng thế nào đến cổ phiếu FPT?')} className="p-5 rounded-2xl bg-white border border-slate-200 hover:-translate-y-1 hover:shadow-lg hover:border-indigo-200 transition-all duration-300 group">
                                            <div className="w-10 h-10 rounded-full bg-indigo-50 flex items-center justify-center mb-3 group-hover:scale-110 transition-transform">
                                                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#6366f1" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
                                            </div>
                                            <span className="block font-bold text-slate-700 mb-1">Tác động Vĩ mô</span>
                                            <span className="text-slate-500 text-[13px]">Xung đột ảnh hưởng nhóm ngành...</span>
                                        </button>
                                    </div>
                                </div>
                            )}

                            {chatHistory.map((msg, index) => (
                                <div key={index} className={`flex ${msg.role === 'user' ? 'justify-end' : 'justify-start'} animate-slide-up`}>
                                    {msg.role === 'user' ? (
                                        <div className="bg-gradient-to-br from-blue-600 to-indigo-600 text-white px-6 py-4 rounded-3xl rounded-tr-sm max-w-[75%] w-fit shadow-[0_4px_14px_0_rgba(37,99,235,0.39)] text-[15px] leading-relaxed font-medium break-words">
                                            {msg.content}
                                        </div>
                                    ) : (
                                        <div className="flex gap-4 w-full">
                                            <div className="w-10 h-10 rounded-2xl bg-gradient-to-tr from-blue-600 to-indigo-500 flex items-center justify-center flex-shrink-0 mt-1 shadow-md">
                                                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="white" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="M12 8V4H8"/><rect width="16" height="12" x="4" y="8" rx="2"/><path d="M2 14h2"/><path d="M20 14h2"/><path d="M15 13v2"/><path d="M9 13v2"/></svg>
                                            </div>
                                            <div className="bg-white border border-slate-100 px-7 py-5 rounded-3xl rounded-tl-sm shadow-[0_8px_30px_rgb(0,0,0,0.04)] w-full overflow-hidden">
                                                <div className="markdown-content w-full" dangerouslySetInnerHTML={{ __html: marked.parse(msg.content) }}></div>
                                            </div>
                                        </div>
                                    )}
                                </div>
                            ))}

                            {loading && (
                                <div className="flex justify-start animate-slide-up">
                                    <div className="flex gap-4 max-w-[85%]">
                                        <div className="w-10 h-10 rounded-2xl bg-gradient-to-tr from-blue-600 to-indigo-500 flex items-center justify-center flex-shrink-0 mt-1 shadow-md">
                                            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="white" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="M12 8V4H8"/><rect width="16" height="12" x="4" y="8" rx="2"/><path d="M2 14h2"/><path d="M20 14h2"/><path d="M15 13v2"/><path d="M9 13v2"/></svg>
                                        </div>
                                        <div className="bg-white border border-slate-100 px-6 py-4 rounded-3xl rounded-tl-sm shadow-[0_8px_30px_rgb(0,0,0,0.04)] flex items-center justify-center h-[52px]">
                                            <div className="flex items-center">
                                                <div className="typing-dot"></div>
                                                <div className="typing-dot"></div>
                                                <div className="typing-dot"></div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            )}
                            <div ref={messagesEndRef} className="h-28" /> 
                        </div>
                    </div>

                    <div className="glass-footer absolute bottom-0 w-full z-20 pb-6 px-4">
                        <div className="max-w-[1100px] mx-auto relative bg-white rounded-[28px] shadow-[0_5px_40px_rgba(0,0,0,0.08)] border border-slate-200 p-2 flex items-end gap-2 transition-all focus-within:shadow-[0_5px_40px_rgba(59,130,246,0.15)] focus-within:border-blue-300">
                            <button type="button" className="p-3 text-slate-400 hover:text-blue-600 hover:bg-blue-50 rounded-full transition-colors flex-shrink-0 mb-0.5 ml-1">
                                <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m21.44 11.05-9.19 9.19a6 6 0 0 1-8.49-8.49l8.57-8.57A4 4 0 1 1 18 8.84l-8.59 8.57a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg>
                            </button>
                            <textarea 
                                ref={textareaRef}
                                value={prompt}
                                onChange={handleInputResize}
                                onKeyDown={handleKeyDown}
                                disabled={loading}
                                placeholder={loading ? "AI đang phân tích..." : "Nhập câu hỏi hoặc mã cổ phiếu..."}
                                className="w-full bg-transparent text-slate-800 placeholder:text-slate-400 py-3.5 px-2 focus:outline-none resize-none max-h-[150px] min-h-[52px] text-[15px] leading-relaxed disabled:opacity-50"
                                rows="1"
                                style={{ height: "52px" }}
                            ></textarea>
                            <button 
                                type="button"
                                onClick={(e) => handleSend(null, e)}
                                disabled={loading || !prompt.trim()}
                                className={`p-3.5 rounded-full flex-shrink-0 mb-0.5 mr-0.5 transition-all shadow-sm ${prompt.trim() && !loading ? 'bg-blue-600 text-white hover:bg-blue-700 hover:shadow-md hover:-translate-y-0.5' : 'bg-slate-100 text-slate-300 cursor-not-allowed'}`}
                            >
                                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
                            </button>
                        </div>
                        <p className="text-center text-[11.5px] text-slate-400 font-medium mt-3.5">AI tự động cập nhật số liệu VNSTOCK.</p>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<StockAgent />);
    </script>
</body>
</html>
